[project]
name = "fpu-rev2"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [ "fpu_emu_v1"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "ARG",     # Enforces flake8-unused-arguments (ARG001, ARG002, etc.)
    "SLF",
    "C901", # McCabe cyclomatic complexity
    "SLF001", # Flags direct private access (obj._foo)
    "B009",   # Flags getattr with constant strings (getattr(obj, "_foo"))
]
ignore = [
    "E501", # Line length handled separately
]


[tool.ruff.lint.per-file-ignores]
"fpu_emu/tests/**" = ["SLF001", "C901"]
"fpu_emu/memory/registers.py" = ["C901"] # Protected by agents.md rule 16

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["fpu_emu"]
extraPaths = [".", "tools"]

