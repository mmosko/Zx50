[project]
name = "fpu_emu"
version = "0.1.0"
description = "FPU emulator"
requires-python = ">=3.9"
dependencies = []

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src"]

[tool.ruff.lint]
# Enable default rules (E, F) along with private access checks (SLF001, B009)
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "SLF001", # Flags direct private access (obj._foo)
    "B009",   # Flags getattr with constant strings (getattr(obj, "_foo"))
]

# Ignore specific rules globally
ignore = [
    "E501",   # Ignore line-too-long warnings
]

[tool.ruff.lint.per-file-ignores]
# Allow private member access in test files
"tests/*" = ["SLF001"]
"**/test_*.py" = ["SLF001"
]