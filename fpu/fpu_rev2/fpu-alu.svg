<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="100%" height="100%" style="background-color: #0f172a; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Arrow Markers (Pointing Down/Forward) -->
    <marker id="arrow-blue-down" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 0 L 5 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-purple-down" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 0 L 5 10 z" fill="#c084fc"/>
    </marker>
    <marker id="arrow-green-down" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 0 L 5 10 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-orange-right" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c"/>
    </marker>
    
    <!-- Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="500" y="30" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" letter-spacing="1">FPGA INTERNAL DATA PATH &amp; EXECUTION LAYOUT</text>

  <!-- ================= REGISTER FILE CONTAINER ================= -->
  <rect x="140" y="55" width="810" height="110" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <text x="155" y="78" fill="#94a3b8" font-size="12" font-weight="bold" letter-spacing="0.5">REGISTER FILE (WRITEBACK DESTINATIONS)</text>

  <!-- Registers -->
  <g transform="translate(160, 90)">
    <!-- AX -->
    <rect x="0" y="0" width="40" height="30" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="20" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">AH</text>
    <rect x="40" y="0" width="40" height="30" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="60" y="20" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">AL</text>
    <text x="40" y="44" fill="#7dd3fc" font-size="10" text-anchor="middle">AX</text>

    <!-- BX -->
    <rect x="95" y="0" width="40" height="30" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="115" y="20" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">BH</text>
    <rect x="135" y="0" width="40" height="30" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="155" y="20" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">BL</text>
    <text x="135" y="44" fill="#7dd3fc" font-size="10" text-anchor="middle">BX</text>

    <!-- DX -->
    <rect x="190" y="0" width="40" height="30" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="210" y="20" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">DH</text>
    <rect x="230" y="0" width="40" height="30" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="250" y="20" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">DL</text>
    <text x="230" y="44" fill="#7dd3fc" font-size="10" text-anchor="middle">DX</text>

    <!-- FX -->
    <rect x="285" y="0" width="40" height="30" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="305" y="20" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">FH</text>
    <rect x="325" y="0" width="40" height="30" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="345" y="20" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">FL</text>
    <text x="325" y="44" fill="#7dd3fc" font-size="10" text-anchor="middle">FX</text>

    <!-- Single/Special Registers -->
    <rect x="380" y="0" width="35" height="30" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="397" y="20" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">C</text>

    <rect x="425" y="0" width="40" height="30" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="445" y="20" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">EA</text>

    <rect x="475" y="0" width="40" height="30" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="495" y="20" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">EB</text>

    <!-- Control/Pointer Registers -->
    <rect x="530" y="0" width="45" height="30" fill="#475569" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="552" y="20" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">SP</text>

    <rect x="585" y="0" width="45" height="30" fill="#475569" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="607" y="20" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">OSP</text>

    <rect x="640" y="0" width="45" height="30" fill="#475569" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="662" y="20" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">UPC</text>

    <rect x="695" y="0" width="70" height="30" fill="#475569" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="730" y="20" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">STATUS</text>
  </g>

  <!-- ================= MUX STAGE ================= -->

  <!-- MUX1 (AH, AL Inputs - NO ARROWS ON INPUTS) -->
  <g transform="translate(170, 220)">
    <polygon points="0,0 120,0 100,40 20,40" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="60" y="24" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">MUX1</text>
  </g>

  <!-- MUX1 Feed Lines (Clean solid lines, no arrowheads) -->
  <path d="M 180,120 L 195,220" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M 220,120 L 245,220" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <text x="175" y="195" fill="#7dd3fc" font-size="10" font-weight="bold">{AH, AL}</text>

  <!-- HB_MUX (All Main Registers - NO ARROWS ON INPUTS) -->
  <g transform="translate(380, 220)">
    <polygon points="0,0 540,0 490,40 50,40" fill="#7e22ce" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="270" y="24" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">HB_MUX</text>
  </g>

  <!-- HB_MUX Feed Lines from Register Groups (Clean solid purple lines, no arrowheads) -->
  <path d="M 200,120 L 200,175 L 420,175 L 420,220" stroke="#c084fc" stroke-width="2" fill="none"/> <!-- AX -->
  <path d="M 295,120 L 295,185 L 500,185 L 500,220" stroke="#c084fc" stroke-width="2" fill="none"/> <!-- BX -->
  <path d="M 390,120 L 390,195 L 580,195 L 580,220" stroke="#c084fc" stroke-width="2" fill="none"/> <!-- DX -->
  <path d="M 485,120 L 485,220" stroke="#c084fc" stroke-width="2" fill="none"/>                    <!-- FX -->
  <path d="M 605,120 L 605,220" stroke="#c084fc" stroke-width="2" fill="none"/>                    <!-- C, EA, EB -->
  <text x="640" y="190" fill="#e9d5ff" font-size="10" font-weight="bold">{AH, AL, BH, BL, DH, DL, FH, FL, C, EA, EB}</text>


  <!-- ================= BUS TRUNKS & MUX OUTPUT ARROWS ================= -->

  <!-- HA_BUS Line & Output Arrow from MUX1 Bottom -->
  <path d="M 230,260 L 230,315" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrow-blue-down)"/>
  <path d="M 230,315 L 880,315" stroke="#38bdf8" stroke-width="3" fill="none"/>
  <rect x="250" y="303" width="75" height="20" rx="4" fill="#0c4a6e" stroke="#38bdf8"/>
  <text x="287" y="317" fill="#7dd3fc" font-size="10" font-weight="bold" text-anchor="middle">HA_BUS</text>

  <!-- HB_BUS Line & Output Arrow from HB_MUX Bottom (Fully Connected Trunk across ALL blocks) -->
  <path d="M 650,260 L 650,345" stroke="#c084fc" stroke-width="3" fill="none" marker-end="url(#arrow-purple-down)"/>
  <path d="M 180,345 L 880,345" stroke="#c084fc" stroke-width="3" fill="none"/>
  <rect x="680" y="333" width="75" height="20" rx="4" fill="#581c87" stroke="#c084fc"/>
  <text x="717" y="347" fill="#e9d5ff" font-size="10" font-weight="bold" text-anchor="middle">HB_BUS</text>


  <!-- ================= EXECUTION / ALU BLOCKS ================= -->

  <!-- Block 1 (ALU / Adder) -->
  <path d="M 200,315 L 200,390" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow-blue-down)"/>
  <path d="M 220,345 L 220,390" stroke="#c084fc" stroke-width="2" fill="none" marker-end="url(#arrow-purple-down)"/>
  <rect x="170" y="390" width="100" height="70" rx="6" fill="#0f766e" stroke="#2dd4bf" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="220" y="420" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">BLOCK 1</text>
  <text x="220" y="440" fill="#99f6e4" font-size="10" text-anchor="middle">ALU / Adder</text>

  <!-- Block 2 (Shifter) -->
  <path d="M 350,315 L 350,390" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow-blue-down)"/>
  <path d="M 370,345 L 370,390" stroke="#c084fc" stroke-width="2" fill="none" marker-end="url(#arrow-purple-down)"/>
  <rect x="320" y="390" width="100" height="70" rx="6" fill="#0f766e" stroke="#2dd4bf" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="370" y="420" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">BLOCK 2</text>
  <text x="370" y="440" fill="#99f6e4" font-size="10" text-anchor="middle">Shifter / Logic</text>

  <!-- Block 3 (MUL / DIV) -->
  <path d="M 500,315 L 500,390" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow-blue-down)"/>
  <path d="M 520,345 L 520,390" stroke="#c084fc" stroke-width="2" fill="none" marker-end="url(#arrow-purple-down)"/>
  <rect x="470" y="390" width="100" height="70" rx="6" fill="#0f766e" stroke="#2dd4bf" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="520" y="420" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">BLOCK 3</text>
  <text x="520" y="440" fill="#99f6e4" font-size="10" text-anchor="middle">MUL / DIV</text>

  <!-- Block 4 (sysMEM EBR) -->
  <path d="M 650,315 L 650,390" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow-blue-down)"/>
  <path d="M 670,345 L 670,390" stroke="#c084fc" stroke-width="2" fill="none" marker-end="url(#arrow-purple-down)"/>
  <rect x="620" y="390" width="100" height="70" rx="6" fill="#0f766e" stroke="#2dd4bf" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="670" y="420" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">BLOCK 4</text>
  <text x="670" y="440" fill="#99f6e4" font-size="10" text-anchor="middle">sysMEM EBR</text>

  <!-- Block N (Custom / CoProc) -->
  <path d="M 800,315 L 800,390" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow-blue-down)"/>
  <path d="M 820,345 L 820,390" stroke="#c084fc" stroke-width="2" fill="none" marker-end="url(#arrow-purple-down)"/>
  <rect x="770" y="390" width="100" height="70" rx="6" fill="#0f766e" stroke="#2dd4bf" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="820" y="420" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">BLOCK n</text>
  <text x="820" y="440" fill="#99f6e4" font-size="10" text-anchor="middle">Special Func</text>


  <!-- ================= RESULT MUX ================= -->

  <!-- Block Outputs into RES_MUX (NO ARROWS ON INPUTS) -->
  <path d="M 220,460 L 220,520" stroke="#34d399" stroke-width="2" fill="none"/>
  <path d="M 370,460 L 370,520" stroke="#34d399" stroke-width="2" fill="none"/>
  <path d="M 520,460 L 520,520" stroke="#34d399" stroke-width="2" fill="none"/>
  <path d="M 670,460 L 670,520" stroke="#34d399" stroke-width="2" fill="none"/>
  <path d="M 820,460 L 820,520" stroke="#34d399" stroke-width="2" fill="none"/>

  <g transform="translate(140, 520)">
    <polygon points="0,0 760,0 700,45 60,45" fill="#047857" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="380" y="27" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">RES_MUX</text>
  </g>


  <!-- ================= WRITEBACK LOOP & RES_MUX OUTPUT ================= -->

  <!-- RES_BUS Line & Output Arrow from RES_MUX Bottom -->
  <path d="M 520,565 L 520,630" stroke="#fb923c" stroke-width="3" fill="none" marker-end="url(#arrow-green-down)"/>
  <path d="M 520,630 L 60,630 L 60,110 L 140,110" stroke="#fb923c" stroke-width="3" fill="none" marker-end="url(#arrow-orange-right)"/>

  <!-- RES_BUS Label Badges -->
  <rect x="250" y="618" width="90" height="24" rx="4" fill="#7c2d12" stroke="#fb923c"/>
  <text x="295" y="634" fill="#ffedd5" font-size="11" font-weight="bold" text-anchor="middle">RES_BUS</text>

  <rect x="15" y="340" width="90" height="36" rx="4" fill="#7c2d12" stroke="#fb923c"/>
  <text x="60" y="355" fill="#ffedd5" font-size="10" font-weight="bold" text-anchor="middle">WRITEBACK</text>
  <text x="60" y="368" fill="#ffedd5" font-size="9" text-anchor="middle">(CLK + CE Target)</text>

</svg>
